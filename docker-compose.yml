services:
  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - folio-net

  web:
    build:
      context: ./frontend
    depends_on:
      - api
    ports:
      - "8080:8080"
    networks:
      - folio-net

  search:
    build:
      context: ./search_engine
    env_file:
      - ./search_engine/.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./search_engine/bible_index:/search_engine/bible_index
    ports:
      - "8081:8081"
    networks:
      - folio-net

  db:
    image: postgres:16
    env_file:
      - .env
    environment:
      - POSTGRES_DB=auth_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/01-init-multiple-dbs.sh:/docker-entrypoint-initdb.d/01-init-multiple-dbs.sh
      - ./db/02-init.sh:/docker-entrypoint-initdb.d/02-init.sh
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - folio-net

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - redis-data:/data
    networks:
      - folio-net

volumes:
  pgdata:
  redis-data:
  tantivy-index:

networks:
  folio-net:

# shared network — containers reach each other by service name (e.g. "db:5432", "redis:6379")

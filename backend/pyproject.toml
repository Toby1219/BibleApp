[project]
name = "bible-webapp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aerich>=0.10.0",
    "asyncpg>=0.31.0",
    "fastapi-cache2>=0.2.1",
    "httpx2>=2.11.0",
    "jinja2>=3.1.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.4",
    "pyjwt>=2.13.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "redis>=8.1.0",
    "setuptools>=84.0.0",
    "slowapi>=0.1.10",
    "tortoise-orm>=1.1.8",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    
]

[tool.aerich]
tortoise_orm = "app.services.db.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."
